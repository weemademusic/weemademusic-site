<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="WeeMadeMusic: WeeProduce müzik prodüksiyon uygulaması yakında.">
<title>WeeMadeMusic</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2064%2064%27%3E%3Crect%20width=%2764%27%20height=%2764%27%20rx=%2714%27%20fill=%27%2308080b%27/%3E%3Crect%20x=%275.5%27%20y=%2727.5%27%20width=%279%27%20height=%279%27%20rx=%274.50%27%20fill=%27%23f1f3f7%27/%3E%3Crect%20x=%2716.5%27%20y=%2727.5%27%20width=%279%27%20height=%279%27%20rx=%273.38%27%20fill=%27%23f4cdbe%27/%3E%3Crect%20x=%2727.5%27%20y=%2727.5%27%20width=%279%27%20height=%279%27%20rx=%272.25%27%20fill=%27%23f8a686%27/%3E%3Crect%20x=%2738.5%27%20y=%2727.5%27%20width=%279%27%20height=%279%27%20rx=%271.12%27%20fill=%27%23fc804d%27/%3E%3Crect%20x=%2749.5%27%20y=%2727.5%27%20width=%279%27%20height=%279%27%20rx=%270.00%27%20fill=%27%23ff5a14%27/%3E%3C/svg%3E">
<meta name="theme-color" content="#08080b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: tek sütun, ortada okunur blok; üstte dil düğmesi (sağ üst), altta iletişim. Logo: yazı üstte (WEEMADEMUSIC, MADE turuncu), altında beyazdan turuncuya 5 nokta (yuvarlaktan kareye); noktalar yumuşak ve sırayla yanar. */
:root {
  --bg: #08080b;
  --fg: #f1f3f7;
  --muted: #a4a7b3;
  --line: #22232b;
  --accent: #ff5a14;
  --glow: rgba(255, 90, 20, .14);
  --mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --sans: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: radial-gradient(120% 55% at 50% -12%, var(--glow), transparent 62%), var(--bg);
  background-color: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.6;
  min-height: 100vh;
  padding-inline: 20px;
  padding-block: 0;
}
.wrap { max-width: 880px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
.mono { font-family: var(--mono); }
header { display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding-block: 22px; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.lang button { font: inherit; font-family: var(--mono); font-weight: 700; font-size: 12px; letter-spacing: .14em; color: var(--muted); background: transparent; border: 0; padding: 8px 14px; min-height: 36px; cursor: pointer; }
.lang button:hover { color: var(--fg); }
.lang button[aria-pressed="true"] { color: #08080b; background: var(--accent); }
.logo { font-size: clamp(34px, 9vw, 72px); width: fit-content; max-width: 100%; display: flex; flex-direction: column; align-items: center; gap: .45em; }
.dots { --s: .8em; display: flex; gap: calc(var(--s) * .222); }
.dots i { display: block; width: var(--s); height: var(--s); background: var(--c); border-radius: var(--r); opacity: .35; transform: scale(.92); animation: wave 2.4s ease-in-out infinite; animation-delay: calc(var(--n) * .3s); }
@keyframes wave { 0% { opacity: .35; transform: scale(.92); } 12% { opacity: 1; transform: scale(1.08); } 30%, 100% { opacity: .35; transform: scale(.92); } }
main { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 26px; padding-block: 48px; }
h1 { margin: 0; font-family: var(--mono); font-weight: 700; font-size: 1em; line-height: 1; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
h1 span { color: var(--accent); }
.status { display: inline-flex; align-items: center; gap: 10px; width: fit-content; max-width: 100%; padding: 10px 16px; border: 1px solid var(--line); border-radius: 999px; font-family: var(--mono); font-weight: 500; font-size: 12px; letter-spacing: .16em; color: var(--muted); text-transform: uppercase; }
.wp-logo { height: 24px; width: auto; flex: none; display: block; }
footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 24px; padding-block: 24px 28px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
.mail { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; min-width: 0; }
.mail a { color: var(--fg); text-decoration: none; border-bottom: 1px solid var(--accent); overflow-wrap: anywhere; user-select: all; }
.mail a:hover { color: var(--accent); }
button.copy { font: inherit; font-family: var(--mono); font-weight: 500; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-height: 36px; cursor: pointer; }
button.copy:hover { color: var(--fg); border-color: var(--muted); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { .dots i { animation: none; opacity: 1; transform: none; } }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="lang" role="group" aria-label="Language / Dil">
      <button type="button" data-lang="tr" aria-pressed="true">TR</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <main>
    <div class="logo">
      <h1 lang="en">Wee<span>Made</span>Music</h1>
      <div class="dots" aria-hidden="true"><i style="--n:0;--c:#f1f3f7;--r:50.0%"></i><i style="--n:1;--c:#f4cdbe;--r:37.5%"></i><i style="--n:2;--c:#f8a686;--r:25.0%"></i><i style="--n:3;--c:#fc804d;--r:12.5%"></i><i style="--n:4;--c:#ff5a14;--r:0.0%"></i></div>
    </div>
    <span class="status"><svg class="wp-logo" viewBox="0 0 24 19" aria-hidden="true"><rect x="0" y="0" width="4" height="4" rx="1" fill="#ff5a14"/><rect x="5" y="0" width="4" height="4" rx="1" fill="#22232b"/><rect x="10" y="0" width="4" height="4" rx="1" fill="#22232b"/><rect x="15" y="0" width="4" height="4" rx="1" fill="#22232b"/><rect x="20" y="0" width="4" height="4" rx="1" fill="#ff5a14"/><rect x="0" y="5" width="4" height="4" rx="1" fill="#ff5a14"/><rect x="5" y="5" width="4" height="4" rx="1" fill="#22232b"/><rect x="10" y="5" width="4" height="4" rx="1" fill="#ff5a14"/><rect x="15" y="5" width="4" height="4" rx="1" fill="#22232b"/><rect x="20" y="5" width="4" height="4" rx="1" fill="#ff5a14"/><rect x="0" y="10" width="4" height="4" rx="1" fill="#ff5a14"/><rect x="5" y="10" width="4" height="4" rx="1" fill="#22232b"/><rect x="10" y="10" width="4" height="4" rx="1" fill="#ff5a14"/><rect x="15" y="10" width="4" height="4" rx="1" fill="#22232b"/><rect x="20" y="10" width="4" height="4" rx="1" fill="#ff5a14"/><rect x="0" y="15" width="4" height="4" rx="1" fill="#22232b"/><rect x="5" y="15" width="4" height="4" rx="1" fill="#ff5a14"/><rect x="10" y="15" width="4" height="4" rx="1" fill="#22232b"/><rect x="15" y="15" width="4" height="4" rx="1" fill="#ff5a14"/><rect x="20" y="15" width="4" height="4" rx="1" fill="#22232b"/></svg><span data-i18n="status">WeeProduce · yakında</span></span>
  </main>

  <footer>
    <div class="mail">
      <span data-i18n="contact">İletişim</span>
      <a id="mailLink" href="mailto:info@weemademusic.com">info@weemademusic.com</a>
      <button class="copy" id="copyBtn" type="button" data-i18n="copy">Kopyala</button>
    </div>
    <span>© WeeMadeMusic</span>
  </footer>
</div>

<script>
(function () {
  var T = {
    tr: {
      desc: 'WeeMadeMusic: WeeProduce müzik prodüksiyon uygulaması yakında.',
      status: 'WeeProduce · yakında', contact: 'İletişim', copy: 'Kopyala', copied: 'Kopyalandı'
    },
    en: {
      desc: 'WeeMadeMusic: the WeeProduce music production app is coming soon.',
      status: 'WeeProduce · coming soon', contact: 'Contact', copy: 'Copy', copied: 'Copied'
    }
  };
  var lang = 'tr';
  var btn = document.getElementById('copyBtn');
  var link = document.getElementById('mailLink');
  var timer = null;

  function apply(l) {
    lang = T[l] ? l : 'tr';
    document.documentElement.lang = lang;
    document.querySelector('meta[name="description"]').setAttribute('content', T[lang].desc);
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++) nodes[i].textContent = T[lang][nodes[i].getAttribute('data-i18n')];
    var bs = document.querySelectorAll('.lang button');
    for (var j = 0; j < bs.length; j++) bs[j].setAttribute('aria-pressed', bs[j].getAttribute('data-lang') === lang ? 'true' : 'false');
    try { localStorage.setItem('wmm-lang', lang); } catch (e) {}
  }

  // İlk dil: kayıtlı seçim, yoksa tarayıcı dili (tr değilse İngilizce).
  var saved = null;
  try { saved = localStorage.getItem('wmm-lang'); } catch (e) {}
  var nav = (navigator.language || 'tr').toLowerCase();
  apply(saved || (nav.indexOf('tr') === 0 ? 'tr' : 'en'));

  document.querySelector('.lang').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-lang]');
    if (b) apply(b.getAttribute('data-lang'));
  });

  btn.addEventListener('click', function () {
    var text = 'info@weemademusic.com';
    function done() {
      btn.textContent = T[lang].copied;
      clearTimeout(timer);
      timer = setTimeout(function () { btn.textContent = T[lang].copy; }, 1600);
    }
    function fallback() {
      try { var r = document.createRange(); r.selectNodeContents(link); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) {}
    }
    try {
      navigator.clipboard.writeText(text).then(done, fallback);
    } catch (e) { fallback(); }
  });
})();
</script>

</body>
</html>
